<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chat – High-End Stays</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      background: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overscroll-behavior-y: none;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(226, 232, 240, 0.6) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: -1;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 20px;
    }

    header {
      flex-shrink: 0;
      margin: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    nav { display: flex; align-items: center; gap: 20px; }
    nav a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.3s;
    }
    nav a:hover { color: var(--primary); }
    #logoutBtn { color: #ef4444; font-weight: 600; }
    #logoutBtn:hover { color: #dc2626; }

    .chat-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 20px 20px;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 15px 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.4);
    }
    
    #otherAvatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #otherName {
      font-weight: 700;
      font-size: 16px;
      color: #0f172a;
    }

    #propertyInfo {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status {
      font-size: 13px;
      font-weight: 600;
      color: #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .chat-body {
      flex: 1;
      padding: 20px 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scroll-behavior: smooth;
    }

    .chat-body::-webkit-scrollbar { width: 6px; }
    .chat-body::-webkit-scrollbar-track { background: transparent; }
    .chat-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

    .message {
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
    }

    .message.me {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.them {
      background: #fff;
      color: #0f172a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .meta {
      font-size: 11px;
      opacity: 0.8;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .message.me .meta { color: rgba(255,255,255,0.8); text-align: right; }
    .message.them .meta { color: var(--text-muted); }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-size: 15px;
      margin: auto; 
    }

    .chat-input {
      padding: 20px 25px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(255,255,255,0.4);
    }

    #textInput {
      flex: 1;
      padding: 14px 20px;
      border-radius: 30px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(255, 255, 255, 0.8);
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
      transition: all 0.3s;
      outline: none;
    }
    #textInput::placeholder { color: #94a3b8; }
    #textInput:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .send-btn {
      background: var(--primary);
      color: white;
      padding: 14px 24px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }
    .send-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 10px; padding: 12px; margin: 10px; border-radius: 16px; }
      nav { flex-wrap: wrap; justify-content: center; }
      .chat-wrapper { padding: 0 10px 10px; }
      .message { max-width: 85%; }
      .chat-header { padding: 15px; }
      .chat-input { padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Hostel Hunt</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="inbox.html" style="color: var(--primary); font-weight: 600;">Messages</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<div class="chat-wrapper">
    <div class="glass-panel chat-container" id="chatWrap" aria-live="polite">
      
      <div class="chat-header" id="chatHeader">
        <img id="otherAvatar" src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?q=80&w=2080&auto=format&fit=crop" alt="User Avatar"/>
        <div style="flex: 1;">
          <div id="otherName">Connecting...</div>
          <div id="propertyInfo">Fetching property details</div>
        </div>
        <div>
          <span class="status" id="typingStatus" style="display:none;">typing...</span>
        </div>
      </div>

      <div class="chat-body" id="messages"></div>

      <div class="chat-input">
        <input id="textInput" placeholder="Type your message here..." autocomplete="off" />
        <button id="sendBtn" class="send-btn">Send</button>
      </div>
      
    </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js"; 
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    collection, doc, getDoc, setDoc, query, onSnapshot,
    orderBy, addDoc, serverTimestamp, updateDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // Accept 'otherId' from the inbox, or fallback to 'ownerId' from a new property inquiry
  const params = new URLSearchParams(window.location.search);
  const chatPartnerId = params.get("otherId") || params.get("ownerId");
  const propertyId = params.get("propertyId");

  const messagesDiv = document.getElementById("messages");
  const sendBtn = document.getElementById("sendBtn");
  const textInput = document.getElementById("textInput");
  const otherName = document.getElementById("otherName");
  const otherAvatar = document.getElementById("otherAvatar");
  const propertyInfo = document.getElementById("propertyInfo");
  const typingStatus = document.getElementById("typingStatus");
  const logoutBtn = document.getElementById("logoutBtn");

  let currentUser = null;
  let chatDocRef = null;
  let messagesUnsub = null;
  let propTitle = "Property"; 

  logoutBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    await signOut(auth);
    location.href = "login.html";
  });

  function scrollToBottom() { 
      setTimeout(() => {
          messagesDiv.scrollTop = messagesDiv.scrollHeight; 
      }, 50);
  }

  function renderMessage(m) {
    const el = document.createElement("div");
    el.className = "message " + (m.senderId === currentUser.uid ? "me" : "them");

    const meta = document.createElement("div");
    meta.className = "meta";
    
    let timeStr = "";
    if (m.time?.toDate) {
        timeStr = m.time.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    } else if (m.time) {
        timeStr = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    } else {
        timeStr = "Just now";
    }

    meta.textContent = (m.senderName || (m.senderId === currentUser.uid ? "You" : "User")) + " • " + timeStr;
    el.appendChild(meta);

    const text = document.createElement("div");
    text.textContent = m.text;
    el.appendChild(text);

    messagesDiv.appendChild(el);
  }

  function makeChatId(a, b, pid) {
    const ids = [a, b].sort().join("_");
    return `${ids}_p_${pid}`;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) return location.href = "login.html";
    currentUser = user;

    if (!chatPartnerId || !propertyId) {
       return location.href = "inbox.html";
    }

    // Load Other User's Details
    try {
      const partnerSnap = await getDoc(doc(db, "users", chatPartnerId));
      const partner = partnerSnap.exists() ? partnerSnap.data() : {};
      otherName.textContent = partner.name || partner.email.split("@")[0] || "User";
      
      // Use their photo, or generate a placeholder based on their name
      if(partner.photoURL || partner.photoBase64) {
          otherAvatar.src = partner.photoBase64 || partner.photoURL;
      } else {
          otherAvatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(otherName.textContent)}&background=e0f2fe&color=0369a1&rounded=true&bold=true`;
      }
    } catch (err) {
      otherName.textContent = "Chat";
    }

    // Load Property Title
    try {
      const pSnap = await getDoc(doc(db, "properties", propertyId));
      if (pSnap.exists()) {
        const p = pSnap.data();
        propTitle = p.title || "Property";
        propertyInfo.textContent = `Regarding: ${propTitle}`;
      } else {
        propertyInfo.textContent = "Property details unavailable";
      }
    } catch (err) { /* ignore */ }

    // Setup Chat Document
    const chatId = makeChatId(currentUser.uid, chatPartnerId, propertyId);
    chatDocRef = doc(db, "chats", chatId);

    const chatSnap = await getDoc(chatDocRef);
    if (!chatSnap.exists()) {
      await setDoc(chatDocRef, {
        participants: [currentUser.uid, chatPartnerId],
        ownerId: params.get("ownerId") || chatPartnerId, 
        propertyId: propertyId,
        propertyTitle: propTitle,
        createdAt: serverTimestamp(),
        lastMessage: "Chat started",
        lastUpdated: serverTimestamp()
      });
    }

    // Subscribe to Messages
    const msgsRef = collection(db, "chats", chatId, "messages");
    const q = query(msgsRef, orderBy("time", "asc"));

    messagesUnsub = onSnapshot(q, (snap) => {
      messagesDiv.innerHTML = "";
      if (snap.empty) {
        const e = document.createElement("div");
        e.className = "empty";
        e.innerHTML = "<span style='font-size:30px; display:block; margin-bottom:10px;'>👋</span> Say hi to start the conversation";
        messagesDiv.appendChild(e);
        return;
      }
      snap.forEach(d => renderMessage(d.data()));
      scrollToBottom();
    });

    // Typing Indicator
    onSnapshot(chatDocRef, (d) => {
      const data = d.data();
      if (!data) return;
      if(data.typing) {
         const isSomeoneTyping = Object.keys(data.typing).some(uid => uid !== currentUser.uid && data.typing[uid] === true);
         typingStatus.style.display = isSomeoneTyping ? "inline" : "none";
      }
    });
  });

  let isTyping = false;
  let typingTimeoutHandle = null;

  async function setTyping(flag) {
    if (!chatDocRef || !currentUser) return;
    if (isTyping === flag) return; 
    
    isTyping = flag;
    try {
      await updateDoc(chatDocRef, { ["typing." + currentUser.uid]: flag });
    } catch (err) { console.error("Typing indicator error:", err); }
  }

  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { 
        e.preventDefault(); 
        sendMessage(); 
    } else { 
        setTyping(true);
        if (typingTimeoutHandle) clearTimeout(typingTimeoutHandle);
        typingTimeoutHandle = setTimeout(() => setTyping(false), 2000);
    }
  });
  
  sendBtn.addEventListener("click", sendMessage);

  async function sendMessage() {
    const text = textInput.value.trim();
    if (!text) return;
    if (!chatDocRef) return alert("Chat not ready.");

    textInput.value = "";
    setTyping(false);
    textInput.focus();

    const msgsRef = collection(db, "chats", chatDocRef.id, "messages");
    const msg = {
      senderId: currentUser.uid,
      senderName: currentUser.displayName || currentUser.email.split("@")[0] || "User",
      text,
      time: serverTimestamp()
    };

    try {
      await addDoc(msgsRef, msg);
      await updateDoc(chatDocRef, { 
          lastMessage: text, 
          lastUpdated: serverTimestamp(),
          propertyTitle: propTitle 
      });
    } catch (err) {
      console.error("Send failed", err);
      alert("Failed to send message. Please check your connection.");
    }
  }
</script>

</body>
</html>
