<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messages – High-End Stays</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      background: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(226, 232, 240, 0.6) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: -1;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
    }

    header {
      position: sticky;
      top: 15px;
      margin: 0 20px 30px 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    nav { display: flex; align-items: center; gap: 20px; }
    nav a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.3s;
    }
    nav a:hover { color: var(--primary); }
    #dashLink { color: var(--primary); font-weight: 600; }
    #logoutBtn { color: #ef4444; font-weight: 600; }
    #logoutBtn:hover { color: #dc2626; }

    .container {
      max-width: 800px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 25px;
      text-align: center;
    }

    .chat-list {
      overflow: hidden;
      min-height: 400px;
    }

    .chat-item {
      padding: 20px 25px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      background: transparent;
    }
    .chat-item:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateX(4px);
    }
    .chat-item:last-child { border-bottom: none; }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e2e8f0;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border: 2px solid #fff;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .chat-name {
      font-weight: 700;
      color: #0f172a;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      white-space: nowrap;
      margin-left: 10px;
    }

    .last-msg {
      color: var(--text-muted);
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 15px; border-radius: 20px; padding: 15px; }
      nav { flex-wrap: wrap; justify-content: center; }
      .chat-item { padding: 15px; }
      .avatar { width: 48px; height: 48px; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Hostel Hunt</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="owner-dashboard.html" id="dashLink" style="display:none;">Owner Dashboard</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<div class="container">
  <h2 class="page-title">💬 Messages</h2>
  
  <div class="glass-panel chat-list">
      <div id="loading" style="text-align:center; padding: 60px 20px; color:var(--text-muted); font-size:16px;">
        Loading your conversations...
      </div>
      <div id="chatList" style="display:none;"></div>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js"; 
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { collection, query, where, orderBy, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const list = document.getElementById("chatList");
  const loading = document.getElementById("loading");

  onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      
      const snap = await getDoc(doc(db, "users", user.uid));
      if(snap.exists() && (snap.data().role === "owner" || snap.data().role === "admin")) {
          document.getElementById("dashLink").style.display = "inline-block";
      }

      loadChats(user.uid);
  });

  function loadChats(uid) {
      const q = query(
          collection(db, "chats"), 
          where("participants", "array-contains", uid),
          orderBy("lastUpdated", "desc")
      );

      onSnapshot(q, async (snapshot) => {
          loading.style.display = "none";
          list.style.display = "block";
          list.innerHTML = "";

          if (snapshot.empty) {
              list.innerHTML = `
                <div class="empty-state">
                  <span style="font-size:30px; display:block; margin-bottom:15px;">📭</span>
                  No active conversations found.<br>
                  <span style="font-size:14px; color:#94a3b8;">Go to a property page and click 'Message the Owner' to start one.</span>
                </div>`;
              return;
          }

          for (const d of snapshot.docs) {
              const data = d.data();
              
              // Find the ID of the person who is NOT you
              const chatPartnerId = data.participants.find(id => id !== uid) || data.ownerId; 
              const propId = data.propertyId;
              const propTitle = data.propertyTitle || "Property Chat";
              
              // Look up the actual name of the chat partner
              let partnerName = "User";
              try {
                  const partnerSnap = await getDoc(doc(db, "users", chatPartnerId));
                  if (partnerSnap.exists()) {
                      partnerName = partnerSnap.data().name || partnerSnap.data().email.split("@")[0];
                  }
              } catch (err) {
                  console.error("Could not fetch user info", err);
              }

              let timeStr = "";
              if (data.lastUpdated) {
                  const date = data.lastUpdated.toDate();
                  const isToday = new Date().toDateString() === date.toDateString();
                  timeStr = isToday ? date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : date.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
              }

              const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(partnerName)}&background=e0f2fe&color=0369a1&rounded=true&bold=true`;

              // Generate the row with the partner's name, and pass their ID in the URL
              const row = `
                <a href="chat.html?otherId=${chatPartnerId}&propertyId=${propId}" class="chat-item">
                   <img src="${avatarUrl}" class="avatar" alt="Avatar">
                   <div class="chat-info">
                      <div class="chat-header-row">
                          <div class="chat-name">${partnerName} <span style="font-size: 13px; color: #64748b; font-weight: 500; margin-left: 5px;">(${propTitle})</span></div>
                          <div class="chat-time">${timeStr}</div>
                      </div>
                      <div class="last-msg">${data.lastMessage || "Click to view message..."}</div>
                   </div>
                </a>
              `;
              list.innerHTML += row;
          }
      });
  }

  document.getElementById("logoutBtn").onclick = async (e) => { 
    e.preventDefault();
    await signOut(auth); 
    location.href="login.html"; 
  };
</script>

</body>
</html>
