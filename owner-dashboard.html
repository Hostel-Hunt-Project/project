<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Owner Dashboard – High-End Stays</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ========================================
      GLASSMORPHISM & ELEGANT DESIGN SYSTEM 
      ========================================
    */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      background: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(226, 232, 240, 0.6) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: -1;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 20px;
    }

    /* --- Header Navigation --- */
    header {
      position: sticky;
      top: 15px;
      margin: 0 20px 30px 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--primary); }
    #logoutBtn { color: #ef4444; font-weight: 600; }
    #logoutBtn:hover { color: #dc2626; }

    .owner-badge {
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    /* --- Container & Layout --- */
    .container {
      max-width: 1100px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    h3 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* --- Alert Box (Glass Red) --- */
    .alert-box {
      display: none; 
      background: rgba(254, 226, 226, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(252, 165, 165, 0.6);
      color: #991b1b;
      padding: 18px 24px; 
      border-radius: 16px; 
      margin-bottom: 30px; 
      font-size: 15px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.1);
    }

    /* --- List Sections (Bookings & Tenants) --- */
    .list-section {
      padding: 24px;
      margin-bottom: 30px;
      display: none; /* Controlled via JS */
    }
    
    .list-title {
      margin-bottom: 15px;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .booking-item {
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .booking-item:last-child { border-bottom: none; padding-bottom: 0; }

    .item-info strong { font-size: 18px; color: #0f172a; display: block; margin-bottom: 4px; }
    .item-info small { color: var(--text-muted); font-size: 14px; }
    
    .tenant-tag {
      background: rgba(224, 242, 254, 0.8); 
      color: #0369a1; 
      padding: 4px 8px; 
      border-radius: 6px; 
      font-size: 11px; 
      font-weight: 600;
      margin-left: 8px; 
      border: 1px solid rgba(186, 230, 253, 0.6);
      vertical-align: middle;
    }

    .utr-tag {
      font-size: 12px; 
      background: rgba(241, 245, 249, 0.8); 
      color: #475569;
      padding: 4px 8px; 
      border-radius: 6px;
      display: inline-block;
      margin-top: 6px;
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    /* --- Buttons --- */
    .btn, .btn-primary {
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-small {
      font-size: 13px; 
      padding: 8px 16px; 
      cursor: pointer; 
      border: none; 
      border-radius: 20px; 
      color: white; 
      text-decoration: none; 
      display: inline-block; 
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-success { background: #10b981; box-shadow: 0 2px 10px rgba(16,185,129,0.2); }
    .btn-success:hover { background: #059669; }
    
    .btn-danger { background: #ef4444; box-shadow: 0 2px 10px rgba(239,68,68,0.2); }
    .btn-danger:hover { background: #dc2626; }
    
    .btn-warning { background: rgba(254, 243, 199, 0.9); color: #b45309; border: 1px solid rgba(252, 211, 77, 0.5); }
    .btn-warning:hover { background: #fef3c7; color: #92400e; }
    
    .btn-info { background: #3b82f6; box-shadow: 0 2px 10px rgba(59,130,246,0.2); }
    .btn-info:hover { background: #2563eb; }

    .action-group { display: flex; gap: 8px; flex-wrap: wrap; }

    /* --- Properties Grid --- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    .property-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .property-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      background: rgba(255,255,255,0.85);
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .card-body { padding: 20px; flex: 1; }
    .card-body strong { font-size: 18px; color: #0f172a; display: block; margin-bottom: 6px; }
    .card-price { color: #10b981; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
    .card-loc { font-size: 13px; color: var(--text-muted); }

    .card-actions {
      padding: 15px 20px;
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(248, 250, 252, 0.4);
    }
    
    .action-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .action-link:hover { color: var(--primary-hover); text-decoration: underline; }
    
    .action-delete {
      color: #ef4444;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .action-delete:hover { color: #dc2626; text-decoration: underline; }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 15px; border-radius: 20px; padding: 15px; }
      .nav-links { flex-wrap: wrap; justify-content: center; }
      .section-header { flex-direction: column; align-items: flex-start; gap: 15px; }
      .booking-item { flex-direction: column; align-items: flex-start; }
      .action-group { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Hostel Hunt</a>
  <div class="nav-links">
    <span class="owner-badge" id="ownerName">Owner</span>
    <a href="inbox.html">Messages</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</header>

<div class="container">
  
  <div id="paymentWarning" class="alert-box">
      <strong>⚠️ Action Required:</strong> You have pending commission payments. 
      Please check your <a href="inbox.html" style="color:#b91c1c; font-weight:bold; text-decoration:underline;">Inbox</a> for payment reminders from the Admin.
  </div>

  <div id="bookingSection" class="glass-panel list-section">
      <h3 class="list-title" style="color:#b45309;">⏳ New Booking Requests</h3>
      <div id="bookingItems">Loading...</div>
  </div>

  <div id="tenantSection" class="glass-panel list-section">
      <h3 class="list-title" style="color:#15803d;">👥 Active Tenants</h3>
      <div id="tenantItems">Loading...</div>
  </div>

  <div class="section-header" style="margin-top:40px;">
    <h3>My Properties</h3>
    <a href="add_property.html" class="btn-primary">+ Add New Property</a>
  </div>

  <div id="propertyList" class="card-grid">
    <div style="grid-column: 1/-1; text-align:center; color:#64748b; padding:40px;">Loading your properties...</div>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js"; 
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { collection, query, where, getDocs, deleteDoc, doc, getDoc, updateDoc, setDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  onAuthStateChanged(auth, async (user) => {
    if (!user) { location.href = "login.html"; return; }
    const snap = await getDoc(doc(db, "users", user.uid));
    if(snap.exists()) {
        document.getElementById("ownerName").textContent = snap.data().name || "Owner";
        loadProperties(user.uid);
        loadRequests(user.uid);
        loadTenants(user.uid); 
        checkPendingCommissions(user.uid);
    }
  });

  // --- 1. Load Pending Requests ---
  async function loadRequests(uid) {
      const q = query(collection(db, "bookings"), where("ownerId", "==", uid), where("status", "==", "pending"));
      const snap = await getDocs(q);
      const div = document.getElementById("bookingSection");
      const list = document.getElementById("bookingItems");

      if(snap.empty) { div.style.display="none"; return; }
      
      div.style.display="block";
      list.innerHTML = "";
      
      snap.forEach(d => {
          const b = d.data();
          list.innerHTML += `
            <div class="booking-item" id="book-${d.id}">
               <div class="item-info">
                 <strong>${b.propertyTitle}</strong>
                 <small>Student: ${b.studentEmail}</small><br>
                 <span class="utr-tag">UTR: ${b.transactionId || 'N/A'}</span>
               </div>
               <div class="action-group">
                 <button class="btn-small btn-success" onclick="window.updateBooking('${d.id}', 'confirmed')">Verify</button>
                 <button class="btn-small btn-danger" onclick="window.updateBooking('${d.id}', 'rejected')">Reject</button>
               </div>
            </div>`;
      });
  }

  // --- 2. Load Active Tenants (Confirmed) ---
  async function loadTenants(uid) {
      const q = query(collection(db, "bookings"), where("ownerId", "==", uid), where("status", "==", "confirmed"));
      const snap = await getDocs(q);
      const div = document.getElementById("tenantSection");
      const list = document.getElementById("tenantItems");

      if(snap.empty) { div.style.display="none"; return; }
      
      div.style.display="block";
      list.innerHTML = "";
      
      snap.forEach(d => {
          const b = d.data();
          // Calculate Rent Date (just based on booking day)
          const joinDate = b.createdAt ? b.createdAt.toDate().getDate() : 1;
          
          list.innerHTML += `
            <div class="booking-item">
               <div class="item-info">
                 <strong>${b.propertyTitle} <span class="tenant-tag">Tenant</span></strong>
                 <small>${b.studentEmail || "Student"}</small><br>
                 <small style="color:#64748b; margin-top:4px; display:block;">Rent Cycle: <strong>Day ${joinDate}</strong> of every month</small>
               </div>
               <div class="action-group">
                 <button class="btn-small btn-warning" 
                    onclick="window.sendRentReminder('${b.studentId}', '${b.propertyTitle}', '${b.rent || b.amount}', '${b.propertyId}')">
                    🔔 Request Rent
                 </button>
                 
                 <a href="chat.html?ownerId=${b.studentId}&propertyId=${b.propertyId}" 
                    class="btn-small btn-info">
                    💬 Chat
                 </a>
               </div>
            </div>`;
      });
  }

  // --- 3. Reminder Function (Owner -> Student) ---
  window.sendRentReminder = async (studentId, propTitle, amount, propId) => {
      if(!confirm(`Send rent reminder for ₹${amount} to this student?`)) return;

      const ownerId = auth.currentUser.uid;
      const chatId = [ownerId, studentId].sort().join("_") + "_p_" + propId;
      
      const msgText = `🔔 RENT REMINDER: Hello! This is a reminder that your rent of ₹${amount} for "${propTitle}" is due. Please pay via the usual method.`;

      try {
          await setDoc(doc(db, "chats", chatId), {
              participants: [ownerId, studentId],
              ownerId: ownerId,
              propertyId: propId,
              propertyTitle: propTitle,
              lastMessage: "🔔 Rent Reminder Sent",
              lastUpdated: serverTimestamp()
          }, { merge: true });

          await addDoc(collection(db, "chats", chatId, "messages"), {
              senderId: ownerId,
              senderName: "Property Owner",
              text: msgText,
              time: serverTimestamp()
          });

          alert("Reminder successfully sent to the student's inbox!");
      } catch (e) {
          alert("Error sending reminder: " + e.message);
      }
  };

  // --- Utilities ---
  window.updateBooking = async (id, status) => {
      if(!confirm(`Are you sure you want to ${status} this booking?`)) return;
      await updateDoc(doc(db, "bookings", id), { status });
      document.getElementById(`book-${id}`).remove();
      location.reload(); 
  };

  async function checkPendingCommissions(uid) {
      const q = query(collection(db, "bookings"), where("ownerId", "==", uid), where("commissionPaid", "==", false), where("status", "==", "confirmed"));
      const snap = await getDocs(q);
      if (!snap.empty) document.getElementById("paymentWarning").style.display = "block";
  }

  async function loadProperties(uid) {
    const q = query(collection(db, "properties"), where("ownerId", "==", uid));
    const snap = await getDocs(q);
    const list = document.getElementById("propertyList");
    
    if(snap.empty) { 
      list.innerHTML = `<div class="glass-panel" style="grid-column: 1/-1; text-align:center; padding:50px 20px;">
                          <h3 style="margin-bottom:10px;">No properties yet</h3>
                          <p style="color:var(--text-muted);">Start listing your premium properties to attract tenants.</p>
                        </div>`; 
      return; 
    }
    
    list.innerHTML = "";
    snap.forEach(docSnap => {
      const p = docSnap.data();
      const img = p.photoURL || p.imageBase64 || "https://images.unsplash.com/photo-1554995207-c18c203602cb?q=80&w=2070&auto=format&fit=crop";
      
      list.innerHTML += `
        <div class="glass-panel property-card" id="card-${docSnap.id}">
          <img src="${img}" class="card-img" alt="Property Image">
          <div class="card-body">
            <strong>${p.title}</strong>
            <div class="card-price">₹${p.rent}<span style="font-size:14px; color:#64748b; font-weight:500;">/mo</span></div>
            <div class="card-loc">📍 ${p.city}</div>
          </div>
          <div class="card-actions">
            <div>
              <a href="edit_property.html?id=${docSnap.id}" class="action-link" style="margin-right:12px;">Edit</a>
              <a href="property.html?id=${docSnap.id}" class="action-link">View</a>
            </div>
            <button onclick="window.deleteProp('${docSnap.id}')" class="action-delete">Delete</button>
          </div>
        </div>`;
    });
  }

  window.deleteProp = async (id) => {
      if(confirm("Are you sure you want to delete this property? This action cannot be undone.")) {
          await deleteDoc(doc(db, "properties", id));
          document.getElementById(`card-${id}`).remove();
      }
  };

  document.getElementById("logoutBtn").onclick = async (e) => { 
    e.preventDefault();
    await signOut(auth); 
    location.href="login.html"; 
  };
</script>

</body>
</html>
