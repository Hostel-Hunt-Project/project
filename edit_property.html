<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Property – High-End Stays</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ========================================
      GLASSMORPHISM & ELEGANT DESIGN SYSTEM 
      ========================================
    */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      background: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(248, 250, 252, 0.8) 0%, rgba(226, 232, 240, 0.6) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: -1;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
    }

    /* --- Header Navigation --- */
    header {
      position: sticky;
      top: 15px;
      margin: 0 20px 30px 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    nav a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.3s;
      margin-left: 20px;
    }
    nav a:hover { color: var(--primary); }

    /* --- Container & Form --- */
    .container {
      max-width: 850px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-card {
      padding: 40px;
    }

    #loading {
      text-align: center;
      font-size: 18px;
      color: var(--text-muted);
      padding: 40px;
      font-weight: 500;
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-row > div {
      flex: 1;
    }
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255, 255, 255, 0.6);
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
      transition: all 0.3s;
      outline: none;
      box-sizing: border-box;
    }
    input::placeholder, textarea::placeholder { color: #94a3b8; }
    input:focus, select:focus, textarea:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* --- Map Section --- */
    .map-search {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .map-search input { flex: 1; }
    .map-search button {
      background: var(--text-main);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .map-search button:hover { background: #0f172a; }

    #map {
      height: 350px;
      border-radius: 16px;
      margin-top: 10px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      z-index: 1;
    }

    /* --- Multiple Image Preview Grid --- */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .preview-grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* --- Buttons --- */
    .form-actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .btn, .btn-cancel {
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      flex: 1;
      text-align: center;
    }

    .btn {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.8);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-cancel:hover {
      background: #fef2f2;
      border-color: #ef4444;
    }

    #msg {
      text-align: center;
      margin-top: 15px;
      font-weight: 500;
      color: var(--primary);
    }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 15px; border-radius: 20px; padding: 15px; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      nav a { margin-left: 0; }
      .form-card { padding: 25px 20px; }
      .form-row { flex-direction: column; gap: 0; margin-bottom: 0; }
      .form-actions { flex-direction: column; }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Hostel Hunt</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="owner-dashboard.html" style="color: var(--primary); font-weight: 600;">Owner Dashboard</a>
  </nav>
</header>

<div class="container">
  <h2 class="page-title">Edit Your Property</h2>
  
  <div class="glass-panel form-card">
    <div id="loading">✨ Fetching property details...</div>

    <form id="propertyForm" style="display:none;">
      
      <div class="form-group">
        <label>Property Title</label>
        <input id="title" placeholder="e.g. Premium Boys Hostel" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Property Type</label>
          <select id="type">
            <option value="hostel">Hostel</option>
            <option value="pg">PG</option>
            <option value="room">Room</option>
            <option value="flat">Flat</option>
          </select>
        </div>
        <div class="form-group">
          <label>Suitable For</label>
          <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="both">Both</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Payment Mode</label>
          <select id="paymentMode">
            <option value="cash_upi">Cash & UPI</option>
            <option value="cash_only">Cash Only</option>
            <option value="upi_only">UPI Only</option>
          </select>
        </div>
        <div class="form-group">
          <label>UPI ID (For Payments)</label>
          <input type="text" id="upiId" placeholder="e.g. yourname@okhdfcbank">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Monthly Rent (₹)</label>
          <input type="number" id="rent" placeholder="e.g. 5000" required>
        </div>
        <div class="form-group">
          <label>Available Beds</label>
          <input type="number" id="beds" placeholder="e.g. 5">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>City / Area</label>
          <input id="city" placeholder="e.g. Bhubaneswar" required>
        </div>
        <div class="form-group">
          <label>Nearby College / Landmark</label>
          <input id="nearbyCollege" placeholder="e.g. KIIT University">
        </div>
      </div>

      <div class="form-group">
        <label>Full Address</label>
        <textarea id="address" placeholder="Enter the complete address..." required></textarea>
      </div>

      <div class="form-group">
        <label>Amenities</label>
        <input id="facilities" placeholder="e.g. WiFi, AC, Laundry, CCTV">
      </div>

      <div class="form-group" style="margin-top: 30px;">
        <label>Location Map (Drag marker to update exact spot)</label>
        <div class="map-search">
            <input type="text" id="mapSearchInput" placeholder="Search locality to center map...">
            <button type="button" id="mapSearchBtn">Search</button>
        </div>
        <div id="map"></div>
        <input type="hidden" id="lat">
        <input type="hidden" id="lng">
      </div>

      <div class="form-group" style="margin-top: 30px;">
        <label>Update Property Images (Select multiple to replace existing ones)</label>
        <input type="file" id="imageInput" accept="image/*" multiple>
        <div id="imagePreviewContainer" class="preview-grid"></div>
        <small style="color:var(--text-muted); display:block; margin-top:8px;">Leave this blank to keep your current images.</small>
      </div>

      <div class="form-actions">
        <button class="btn btn-cancel" type="button" onclick="location.href='owner-dashboard.html'">Cancel</button>
        <button class="btn" type="submit" id="submitBtn">Save Changes</button>
      </div>
      <p id="msg"></p>
    </form>
  </div>
</div>

<script>
  var map, marker, geocoder;
  var mapReady = false;
  var pendingLocation = null;

  window.initMap = function() {
      map = new google.maps.Map(document.getElementById('map'), {
          zoom: 13,
          center: { lat: 20.296, lng: 85.824 },
          mapId: "DEMO_MAP_ID", 
          mapTypeControl: false,
          streetViewControl: false,
          gestureHandling: "cooperative"
      });
      
      marker = new google.maps.marker.AdvancedMarkerElement({
          position: { lat: 20.296, lng: 85.824 },
          map: map,
          gmpDraggable: true
      });
      
      geocoder = new google.maps.Geocoder();
      mapReady = true;

      if (pendingLocation) {
          marker.position = pendingLocation;
          map.setCenter(pendingLocation);
          map.setZoom(15);
      }

      marker.addListener("dragend", () => { 
          let lat = marker.position.lat;
          let lng = marker.position.lng;
          if (typeof lat === 'function') { lat = lat(); lng = lng(); }
          
          document.getElementById("lat").value = lat.toFixed(6); 
          document.getElementById("lng").value = lng.toFixed(6); 
      });
  };
</script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCDxF8QDrEWSboPyfqzE6IcylQ1Isl90ZA&loading=async&libraries=places,marker&callback=initMap"></script>

<script type="module">
  import { auth, db } from "./firebase.js"; 
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  let currentUser, propertyId;
  let existingPhotoURLs = []; // Keeps track of currently saved images

  const form = document.getElementById("propertyForm");
  const latInput = document.getElementById("lat");
  const lngInput = document.getElementById("lng");
  const previewContainer = document.getElementById("imagePreviewContainer");
  const imageInput = document.getElementById("imageInput");

  onAuthStateChanged(auth, u => {
      if(!u) location.href="login.html";
      currentUser=u;
      propertyId = new URLSearchParams(window.location.search).get("id");
      if(propertyId) loadData();
  });

  async function loadData() {
      const snap = await getDoc(doc(db, "properties", propertyId));
      if(!snap.exists()) return alert("Property not found");
      const p = snap.data();
      
      document.getElementById("title").value = p.title || "";
      document.getElementById("rent").value = p.rent || "";
      document.getElementById("city").value = p.city || "";
      document.getElementById("nearbyCollege").value = p.nearbyCollege || "";
      document.getElementById("address").value = p.address || "";
      document.getElementById("beds").value = p.availableBeds || "";
      document.getElementById("facilities").value = p.facilities || "";
      document.getElementById("type").value = p.type || "hostel";
      document.getElementById("gender").value = p.forGender || "male";
      document.getElementById("paymentMode").value = p.paymentMode || "cash_upi";
      document.getElementById("upiId").value = p.upiId || "";

      // LOAD EXISTING IMAGES
      previewContainer.innerHTML = "";
      if (p.photoURLs && p.photoURLs.length > 0) {
          existingPhotoURLs = p.photoURLs;
      } else if (p.photoURL) {
          existingPhotoURLs = [p.photoURL]; // Fallback for older single-image properties
      }
      
      existingPhotoURLs.forEach(url => {
          const img = document.createElement("img");
          img.src = url;
          previewContainer.appendChild(img);
      });

      // POSITION MARKER
      const mapLat = p.lat || 20.296;
      const mapLng = p.lng || 85.824;
      const pos = { lat: mapLat, lng: mapLng };
      
      if (mapReady) {
          marker.position = pos; 
          map.setCenter(pos);
          map.setZoom(15);
      } else {
          pendingLocation = pos;
      }
      
      latInput.value = mapLat; 
      lngInput.value = mapLng;

      document.getElementById("loading").style.display="none";
      form.style.display="block";
  }

  // MULTIPLE IMAGE PREVIEW LOGIC
  imageInput.onchange = () => {
      previewContainer.innerHTML = ""; 
      const files = Array.from(imageInput.files);
      
      if (files.length > 0) {
          // Show new selections
          files.forEach(file => {
              const r = new FileReader();
              r.onload = (e) => { 
                  const img = document.createElement("img");
                  img.src = e.target.result;
                  previewContainer.appendChild(img);
              };
              r.readAsDataURL(file);
          });
      } else {
          // If they cancel the selection, revert back to showing existing images
          existingPhotoURLs.forEach(url => {
              const img = document.createElement("img");
              img.src = url;
              previewContainer.appendChild(img);
          });
      }
  };

  // SEARCH MAP IN EDIT
  document.getElementById("mapSearchBtn").onclick = () => {
      if(!mapReady) return alert("Map is still loading. Please try again in a moment.");

      const q = document.getElementById("mapSearchInput").value.trim();
      if(q) {
          geocoder.geocode({ address: q + ", India" }, (results, status) => {
              if (status === "OK") {
                  const loc = results[0].geometry.location;
                  marker.position = loc; 
                  map.setCenter(loc); 
                  map.setZoom(16); 
                  
                  let lat = loc.lat();
                  let lng = loc.lng();
                  latInput.value = lat.toFixed(6); 
                  lngInput.value = lng.toFixed(6); 
              } else {
                  alert("Location not found.");
              }
          });
      }
  };

  // SUBMIT UPDATE TO FIREBASE
  form.onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");
      
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating Property...";
      msg.textContent = "Please wait while we save your changes...";
      
      // Default to existing images if no new ones are selected
      let finalPhotoURLs = existingPhotoURLs;
      let finalMainPhotoURL = existingPhotoURLs.length > 0 ? existingPhotoURLs[0] : "";

      const files = imageInput.files;
      if(files.length > 0) {
          finalPhotoURLs = []; // Clear old images to replace with new batch
          
          // Helper function to read file as Base64
          const fileToBase64 = (file) => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = () => resolve(reader.result);
              reader.onerror = (error) => reject(error);
          });

          for (let i = 0; i < files.length; i++) {
              const base64String = await fileToBase64(files[i]);
              finalPhotoURLs.push(base64String);
          }
          
          // The first image in the new batch becomes the main cover photo
          finalMainPhotoURL = finalPhotoURLs.length > 0 ? finalPhotoURLs[0] : "";
      }

      try {
          await updateDoc(doc(db, "properties", propertyId), {
              title: document.getElementById("title").value,
              rent: Number(document.getElementById("rent").value),
              city: document.getElementById("city").value,
              nearbyCollege: document.getElementById("nearbyCollege").value,
              address: document.getElementById("address").value,
              availableBeds: document.getElementById("beds").value,
              facilities: document.getElementById("facilities").value,
              type: document.getElementById("type").value,
              forGender: document.getElementById("gender").value,
              paymentMode: document.getElementById("paymentMode").value,
              upiId: document.getElementById("upiId").value,
              lat: Number(latInput.value), 
              lng: Number(lngInput.value),
              photoURL: finalMainPhotoURL, // Main display image
              photoURLs: finalPhotoURLs,   // Array of all images
              updatedAt: serverTimestamp()
          });
          location.href = "owner-dashboard.html";
      } catch(error) {
          msg.textContent = "Error updating property: " + error.message;
          msg.style.color = "#ef4444";
          submitBtn.disabled = false;
          submitBtn.textContent = "Save Changes";
      }
  };
</script>
</body>
</html>
