<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – High-End Stays</title>
  <!-- INVISIBLE FIX: Added viewport-fit=cover for modern phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ========================================
      GLASSMORPHISM & ELEGANT DESIGN SYSTEM 
      ========================================
    */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      background: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(248, 250, 252, 0.85) 0%, rgba(226, 232, 240, 0.75) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: -1;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 20px;
    }

    /* --- Header Navigation --- */
    header {
      position: sticky;
      top: 15px;
      margin: 0 20px 30px 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.3s;
    }
    header a:hover { color: var(--primary); }
    #logoutBtn { color: #ef4444; font-weight: 600; }
    #logoutBtn:hover { color: #dc2626; }

    .btn-fix {
      background: rgba(254, 243, 199, 0.9);
      color: #b45309;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(252, 211, 77, 0.5);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .btn-fix:hover { background: #fef3c7; color: #92400e; transform: translateY(-1px); }

    /* --- Container & Layout --- */
    .container {
      max-width: 1100px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 25px;
      text-align: center;
    }

    /* --- Stats Grid --- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .stat-card {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .stat-val {
      font-size: 42px;
      font-weight: 700;
    }
    .val-pending { color: #f59e0b; }
    .val-collected { color: #10b981; }

    /* --- Ledger Section --- */
    .booking-list {
      padding: 30px;
    }

    .booking-list h3 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .booking-item {
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .booking-item:last-child { border-bottom: none; padding-bottom: 0; }

    .item-info { flex: 1; }
    
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .title-row strong { font-size: 18px; color: #0f172a; }

    .meta-row {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .financials {
      font-size: 14px;
      color: var(--text-main);
      font-weight: 500;
      background: rgba(241, 245, 249, 0.6);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
    }
    .comm-text { color: var(--primary); font-weight: 700; }

    /* Badges */
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-confirmed { background: rgba(220, 252, 231, 0.8); color: #15803d; border: 1px solid rgba(134, 239, 172, 0.5); }
    .status-pending { background: rgba(255, 237, 213, 0.8); color: #c2410c; border: 1px solid rgba(253, 186, 116, 0.5); }
    .status-rejected { background: rgba(254, 226, 226, 0.8); color: #991b1b; border: 1px solid rgba(252, 165, 165, 0.5); }

    .paid-badge {
      color: #10b981;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(209, 250, 229, 0.6);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 15px; border-radius: 20px; padding: 15px; }
      .nav-links { flex-wrap: wrap; justify-content: center; }
      .booking-item { flex-direction: column; align-items: flex-start; }
      .item-actions { width: 100%; text-align: left; margin-top: 10px; }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">⚡ Admin Console</div>
  <div class="nav-links">
    <button onclick="window.recalculateCommissions()" class="btn-fix">⚙️ Recalculate Comm.</button>
    <a href="admin-earning.html" style="color:var(--primary); font-weight:600;">Earnings Dashboard</a>
    <a href="index.html">Home</a>
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</header>

<div class="container">
  
  <div class="card-grid">
      <div class="glass-panel stat-card">
          <div class="stat-label">Total Commission (Receivable)</div>
          <div class="stat-val val-pending" id="totalEarnings">₹0</div>
      </div>
      <div class="glass-panel stat-card">
          <div class="stat-label">Total Commission (Collected)</div>
          <div class="stat-val val-collected" id="collectedEarnings">₹0</div>
      </div>
  </div>

  <div class="glass-panel booking-list">
      <h3>Commission Ledger (3%)</h3>
      <div id="ledgerItems">
        <div style="text-align:center; color:var(--text-muted); padding:30px;">Loading data...</div>
      </div>
  </div>

</div>

<script type="module">
  import { auth, db } from "./firebase.js"; 
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { collection, getDocs, query, orderBy, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      
      const snap = await getDoc(doc(db, "users", user.uid));
      if(!snap.exists() || snap.data().role !== "admin") {
          alert("Admins Only");
          location.href = "index.html";
      }
      loadData();
  });

  async function loadData() {
      const q = query(collection(db, "bookings"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      
      let pending = 0;
      let collected = 0;
      const list = document.getElementById("ledgerItems");
      list.innerHTML = "";

      if(snap.empty) { 
        list.innerHTML = "<div style='text-align:center; color:var(--text-muted); padding:30px;'>No bookings found on the platform yet.</div>"; 
        return; 
      }

      snap.forEach(d => {
          const b = d.data();
          const commission = b.platformCommission || 0;
          
          if (b.status !== 'rejected') {
              if (b.commissionPaid) collected += commission;
              else pending += commission;
          }

          const isPaid = b.commissionPaid;
          const statusClass = `status-${b.status}`; // status-pending, status-confirmed, etc.

          list.innerHTML += `
            <div class="booking-item">
               <div class="item-info">
                 <div class="title-row">
                    <strong>${b.propertyTitle || "Unknown Property"}</strong>
                    <span class="status-badge ${statusClass}">${b.status}</span>
                 </div>
                 <div class="meta-row">Owner: ${b.ownerName || "Unknown"}</div>
                 <div class="financials">Rent: ₹${b.amount || 0} &nbsp;|&nbsp; <span class="comm-text">Comm: ₹${commission}</span></div>
               </div>
               <div class="item-actions">
                 ${isPaid 
                   ? '<span class="paid-badge">✔ Received</span>' 
                   : `<button class="btn-primary" onclick="window.markPaid('${d.id}')">Mark Received</button>`
                 }
               </div>
            </div>`;
      });

      document.getElementById("totalEarnings").textContent = "₹" + pending;
      document.getElementById("collectedEarnings").textContent = "₹" + collected;
  }

  // 🔥 THE FIX FUNCTION
  window.recalculateCommissions = async () => {
      if(!confirm("This will fix all '₹0' commissions by calculating 3% of the Rent. Continue?")) return;
      
      try {
          const snap = await getDocs(collection(db, "bookings"));
          let count = 0;
          
          for (const d of snap.docs) {
              const data = d.data();
              // Check for 'amount' or 'rent' field
              const rent = Number(data.amount) || Number(data.rent) || 0;
              
              // Only fix if rent exists and commission is 0 or missing
              if (rent > 0) {
                  const comm = Math.ceil(rent * 0.03);
                  
                  await updateDoc(doc(db, "bookings", d.id), {
                      platformCommission: comm,
                      amount: rent // Ensure amount field is consistent
                  });
                  count++;
              }
          }
          alert(`Successfully updated ${count} bookings! Reloading...`);
          location.reload();
      } catch (e) {
          alert("Error updating: " + e.message);
      }
  };

  window.markPaid = async (id) => {
      if(confirm("Confirm you received this payment offline?")) {
          await updateDoc(doc(db, "bookings", id), { commissionPaid: true });
          loadData();
      }
  };

  document.getElementById("logoutBtn").onclick = async (e) => { 
    e.preventDefault();
    await signOut(auth); 
    location.href="login.html"; 
  };
</script>

</body>
</html>
